repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint

  - repo: local
    hooks:
      - id: runbooks-validate
        name: Validate runbook front-matter
        entry: python3 -m tools.validate
        language: system
        types: [markdown]
        pass_filenames: false
      - id: runbooks-links
        name: Check internal links resolve
        entry: python3 -m tools.lint
        language: system
        types: [markdown]
        pass_filenames: false
