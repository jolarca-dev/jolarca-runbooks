[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jolarca-runbooks"
version = "0.1.0"
description = "Operational runbooks, on-call procedures, and ICT readiness for business continuity (ISO/IEC 27001:2022 A.5.29)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
# tools/ imports these at runtime, so the jrb-* console scripts need them
# even when the dev extra is not installed.
dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.9,<0.17",
    "pytest>=8.0",
    "pre-commit>=3.7",
]

[project.scripts]
jrb-validate = "tools.validate:main"
jrb-lint = "tools.lint:main"
jrb-render = "tools.render:main"
jrb-control-map = "tools.control_map:main"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
