# markdownlint configuration — https://github.com/DavidAnson/markdownlint
default: true

# Line length: allow long lines in prose but not extreme; ignore tables and code blocks.
MD013:
  line_length: 120
  code_blocks: false
  tables: false

# Files begin with YAML front-matter, not an H1, so disable first-line-h1.
MD041: false

# MD025 treats a front-matter `title:` as the document's first H1, which would flag
# the real `# Title` as a duplicate. Every document here carries front-matter by design.
MD025:
  front_matter_title: ""

# Inline HTML (details/summary, comments) is allowed.
MD033: false

# Allow duplicate headings in different sections.
MD024:
  siblings_only: true
