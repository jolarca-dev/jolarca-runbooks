name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-validate-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check tools tests

      - name: Validate front-matter
        run: python -m tools.validate

      - name: Check internal links
        run: python -m tools.lint

      - name: Run tests
        run: python -m pytest

      - name: Regenerate catalogs and control map
        run: |
          python -m tools.render
          python -m tools.control_map

      - name: Check for drift in generated files
        run: |
          if ! git diff --exit-code runbooks/README.md docs/index.md docs/compliance/control-mapping.md; then
            echo "::error::Generated files are out of date. Run 'make render control-map' and commit."
            exit 1
          fi
