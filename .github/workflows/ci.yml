name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-validate-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint and format check
        run: |
          python -m ruff check tools tests
          python -m ruff format --check tools tests

      - name: Validate front-matter
        run: python -m tools.validate

      - name: Check internal links
        run: python -m tools.lint

      - name: Run tests
        run: python -m pytest

      - name: Regenerate catalogs and control map
        run: |
          python -m tools.render
          python -m tools.control_map

      - name: Check for drift in generated files
        run: |
          if ! git diff --exit-code runbooks/README.md docs/index.md docs/compliance/control-mapping.md; then
            echo "::error::Generated files are out of date. Run 'make render control-map' and commit."
            exit 1
          fi

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks (checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -o gitleaks.tar.gz "${url}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository history for secrets
        run: gitleaks detect --source . --redact --no-banner --exit-code 1
